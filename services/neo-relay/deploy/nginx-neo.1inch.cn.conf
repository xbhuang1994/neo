# Reference Nginx port-sharing virtual host for standalone Nginx deployments
# (Shares TCP 443 or 18443 by SNI / Host alongside other services such as magpie.1inch.cn)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name neo.1inch.cn;

    ssl_certificate     /etc/nginx/tls/neo.1inch.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/neo.1inch.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /healthz {
        proxy_pass http://127.0.0.1:18200/healthz;
        proxy_set_header Host $http_host;
    }

    # P2P Signaling & Binary Relay fallback (WebSocket)
    location ~ ^/v1/(signal|relay)$ {
        proxy_pass http://127.0.0.1:18200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:18200;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
