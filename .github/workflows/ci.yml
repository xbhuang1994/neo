name: CI

on:
  push:
    branches: [main, feat/pure-ts-backend]
  pull_request:

env:
  FLUTTER_VERSION: "3.50.0"
  BUN_VERSION: "1.4.4"

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install devDependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Build
        run: bun run build
      - name: Test
        if: runner.os != 'Windows'
        run: bun test
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: bun test tests/core tests/store

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the backend the app's tests start
        run: bun install --frozen-lockfile && bun run build:agent
        working-directory: backend
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - name: Build the web app
        run: flutter build web --release --no-web-resources-cdn --csp --no-source-maps
        working-directory: app

  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-15-intel
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build ${{ matrix.target }} --release
        working-directory: app
