name: Release

# Multi-platform release pipeline for Neo:
#   - macOS Desktop:      Neo-<version>-macos-arm64.dmg, Neo-<version>-macos-x64.dmg
#   - Windows Desktop:    Neo-<version>-windows-x64-setup.exe, Neo-<version>-windows-x64-portable.zip
#   - Linux Desktop:      Neo-<version>-linux-x64.deb, Neo-<version>-linux-x64.tar.gz
#   - Linux Server:       neo-agent-<version>-linux-x64.tar.gz, neo-agent-<version>-linux-arm64.tar.gz
#   - Multi-Device:       neo-agent-os-<version>-{linux-{x64,arm64},macos-{arm64,x64}}.tar.gz, neo-agent-os-<version>-windows-x64.zip, neo-relayd-<version>-linux-{x64,arm64}.tar.gz, neo-agent-mcu-<version>-sdk.tar.gz
#   - Checksums:          SHA256SUMS.txt
#
# Each package bundles the pure-TypeScript (Bun-compiled) neo-agent backend (and neo-recovery on Linux server).
# Antigravity CLI (agy) is not bundled: the app discovers or installs it with the official installer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.7.0). Leave empty for a dry-run build without creating a GitHub Release."
        required: false
        type: string
        default: ""
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark as prerelease (auto-enabled for semver prerelease tags like v0.7.0-rc.1)"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip pre-release tests (workflow_dispatch only; never skipped on tag pushes)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"
  BUN_VERSION: "1.4.4"

jobs:
  prepare:
    name: Validate version & run pre-release checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate release metadata and manifest versions
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "${REF#refs/tags/v}" != "$REF" ]; then
            bun packaging/release.ts check --tag "$REF_NAME" --github-output
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            if [ "$INPUT_PRERELEASE" = "true" ]; then
              bun packaging/release.ts check --tag "$INPUT_TAG" --prerelease --github-output
            else
              bun packaging/release.ts check --tag "$INPUT_TAG" --github-output
            fi
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_DRAFT" = "false" ]; then
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
            else
              echo "is_draft=true" >> "$GITHUB_OUTPUT"
            fi
          else
            bun packaging/release.ts check --github-output
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run packaging checks
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        run: bun test packaging/release.test.ts

      - name: Check & test backend
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          bun test

      - name: Check & test recovery daemon
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        working-directory: recovery
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test

      - name: Set up Flutter for app tests
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze & test Flutter app
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15-intel
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import the signing certificate
        if: env.CERTIFICATE != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p build "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p build "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/build.keychain"
          security set-key-partition-list -S apple-tool:,apple: -k build "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain"
      - name: Build the disk image
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          packaging/macos/build-dmg.sh --arch ${{ matrix.arch }}
      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/*.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/*.dmg
      - name: Build Tier 1 OS agent (neo-agent-os)
        run: |
          packaging/macos/build-agent-os.sh --arch ${{ matrix.arch }} --version "${{ needs.prepare.outputs.version }}"
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/Neo-*-macos-${{ matrix.arch }}.dmg
            dist/neo-agent-os-*-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage desktop app and build portable archive
        shell: pwsh
        run: |
          ./packaging/windows/stage.ps1
      - name: Build Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "failed to install Inno Setup" }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DStage=$PWD\dist\windows-stage" packaging\windows\neo-agent.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }
      - name: Build Tier 1 OS agent (neo-agent-os.exe)
        shell: pwsh
        run: |
          ./packaging/windows/build-agent-os.ps1 -Version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/Neo-*-windows-x64-setup.exe
            dist/Neo-*-windows-x64-portable.zip
            dist/neo-agent-os-*-windows-x64.zip
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop x64
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config
      - name: Build Linux desktop tarball and .deb package
        run: |
          packaging/linux/build-desktop.sh --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-x64
          path: |
            dist/Neo-*-linux-x64.tar.gz
            dist/Neo-*-linux-x64.deb
          if-no-files-found: error

  linux-server:
    name: Linux server (x64 & arm64)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build and smoke-test Linux server x64 tarball
        run: |
          packaging/linux/build-server.sh --arch x64
      - name: Cross-compile and package Linux server arm64 tarball
        run: |
          packaging/linux/build-server.sh --arch arm64 --skip-web-build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: |
            dist/neo-agent-*-linux-x64.tar.gz
            dist/neo-agent-*-linux-arm64.tar.gz
          if-no-files-found: error

  multi-device:
    name: Multi-device agents & relay (x64 & arm64 + MCU SDK)
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install ARM64 cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Test neo-relay, neo-agent-os, and neo-agent-mcu
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_tests
        run: |
          (cd services/neo-relay && go test -race ./...)
          (cd agents/neo-agent-os && cargo test)
          (cd agents/neo-agent-mcu && make clean all test size-check)
      - name: Build multi-device release archives
        run: |
          packaging/linux/build-multi-device.sh --version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: multi-device
          path: |
            dist/neo-agent-os-*-linux-x64.tar.gz
            dist/neo-agent-os-*-linux-arm64.tar.gz
            dist/neo-relayd-*-linux-x64.tar.gz
            dist/neo-relayd-*-linux-arm64.tar.gz
            dist/neo-agent-mcu-*-sdk.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: needs.prepare.outputs.should_publish == 'true'
    needs: [prepare, macos, windows, linux-desktop, linux-server, multi-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete multi-platform artifact set
        run: |
          bun packaging/release.ts verify-dist "${{ needs.prepare.outputs.version }}" dist
      - name: Generate and verify SHA-256 checksums
        run: |
          (
            cd dist
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum
          ) > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Generate release notes and workflow summary
        run: |
          bun packaging/release.ts notes "${{ needs.prepare.outputs.version }}" --dist dist --out release-notes.md
          {
            cat release-notes.md
            echo "### SHA256SUMS.txt"
            echo ""
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Neo ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
