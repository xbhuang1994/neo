[package]
name = "neo-agent-os"
version = "0.10.1"
edition = "2021"
default-run = "neo-agent-os"
description = "Tier 1 OS Agent and Tier 2 MCU Relay Bridge for Multi-Device Neo"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process", "sync", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
url = "2"
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
