<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Neo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Neo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Neo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start critical web assets downloading in parallel on first byte. -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="assets/fonts/NotoSansSC-Regular.otf" as="fetch" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #000000;
        color: #f2f2f7;
      }
      #neo-splash-ring {
        border-color: rgba(255, 255, 255, 0.16);
        border-top-color: #0a84ff;
      }
    }
    #neo-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: inherit;
      transition: opacity 140ms ease-out;
    }
    #neo-splash.neo-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #neo-splash-mark {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: linear-gradient(135deg, #5ac8fa, #007aff, #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      box-shadow: 0 6px 20px rgba(0, 122, 255, 0.24);
    }
    #neo-splash-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.12);
      border-top-color: #007aff;
      animation: neo-spin 0.8s linear infinite;
    }
    @keyframes neo-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="neo-splash" aria-label="Loading Neo">
    <div id="neo-splash-mark">N</div>
    <div id="neo-splash-ring"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
